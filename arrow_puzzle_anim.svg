    <linearGradient id="grad-7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#222222" />
