<svg width={size} height={size} viewBox="-2 -2 28 28" fill="none" style={{ display: 'block', overflow: 'visible' }}>
          <defs>
            <linearGradient id="windGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stopColor="#818cf8" />
              <stop offset="50%" stopColor="#3730a3" />
              <stop offset="100%" stopColor="#1e1b4b" />
            </linearGradient>
            <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stopColor="#f8fafc" />
              <stop offset="50%" stopColor="#94a3b8" />
              <stop offset="100%" stopColor="#334155" />
            </linearGradient>
            <filter id="windGlow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="1.5" result="blur" />
              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          <style>
            {`
              @keyframes windSpin {
                0%, 80%, 100% { transform: rotate(0deg) scale(1); filter: drop-shadow(0px 3px 5px rgba(0,0,0,0.5)); opacity: 0.8; }
                85% { transform: rotate(180deg) scale(1.1); filter: drop-shadow(0px 8px 12px rgba(129,140,248,0.6)); opacity: 1; }
                95% { transform: rotate(360deg) scale(1); filter: drop-shadow(0px 3px 5px rgba(0,0,0,0.5)); opacity: 0.8; }
              }
              .wind-swirl {
                animation: windSpin 7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
                transform-origin: 12px 12px;
              }
            `}
          </style>
          
          <g className="wind-swirl">
            {/* Wind Swirl Aura */}
            <path d="M12 2 C18 2 22 6 22 12 C22 13.5 21 14.5 19.5 14.5 C18 14.5 17 13.5 17 12 C17 9 15 7 12 7 C9 7 7 9 7 12 C7 15 9 17 12 17 C13.5 17 14.5 18 14.5 19.5 C14.5 21 13.5 22 12 22 C6 22 2 18 2 12 C2 6 6 2 12 2 Z" fill="url(#windGrad)" opacity="0.4" filter="url(#windGlow)"/>
            {/* Inner Wind Current */}
            <path d="M12 4 C16 4 19 7 19 12 C19 12.8 18.5 13.2 18 13.2 C17.5 13.2 17 12.8 17 12 C17 9 15 7 12 7 C9 7 7 9 7 12 C7 15 9 17 12 17 C12.8 17 13.2 17.5 13.2 18 C13.2 18.5 12.8 19 12 19 C8 19 5 16 5 12 C5 8 8 4 12 4 Z" fill="none" stroke="#c7d2fe" strokeWidth="0.8" strokeDasharray="3 3"/>
          </g>

          <text x="12" y="13.5" fontSize="14" fontWeight="900" fill="url(#silverGrad)" stroke="#1e1b4b" strokeWidth="0.5" textAnchor="middle" dominantBaseline="middle" fontFamily='"Microsoft YaHei", "SimHei", sans-serif' filter="drop-shadow(1px 2px 2px rgba(0,0,0,0.8))">
            西
          </text>
        </svg>
