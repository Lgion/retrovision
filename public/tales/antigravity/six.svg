<svg width={size} height={size} viewBox="-2 -2 28 28" fill="none" style={{ display: 'block', overflow: 'visible' }}>
          <defs>
            <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stopColor="#38bdf8" />
              <stop offset="50%" stopColor="#1d4ed8" />
              <stop offset="100%" stopColor="#0f172a" />
            </linearGradient>
            <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stopColor="#cffafe" />
              <stop offset="50%" stopColor="#06b6d4" />
              <stop offset="100%" stopColor="#083344" />
            </linearGradient>
            <filter id="waterGlow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="1.5" result="blur" />
              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          <style>
            {`
              @keyframes rippleAnim {
                0%, 80%, 100% { transform: scale(1); opacity: 0.8; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.4)); }
                85% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0px 0px 10px rgba(56,189,248,0.8)); }
                90% { transform: scale(0.95); opacity: 0.9; }
                95% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0px 0px 8px rgba(56,189,248,0.6)); }
              }
              .water-frame {
                animation: rippleAnim 6s ease-in-out infinite;
                transform-origin: 12px 12px;
              }
            `}
          </style>

          <g className="water-frame">
            {/* Hexagonal Sapphire Frame */}
            <path d="M12 1 L22 6 L22 18 L12 23 L2 18 L2 6 Z" fill="none" stroke="url(#navyGrad)" strokeWidth="1.5" filter="url(#waterGlow)"/>
            {/* Inner Scintillating Border */}
            <path d="M12 3 L20 7 L20 17 L12 21 L4 17 L4 7 Z" fill="none" stroke="#7dd3fc" strokeWidth="0.5" strokeDasharray="2 4"/>
          </g>

          <text x="12" y="13.5" fontSize="13" fontWeight="900" fill="url(#cyanGrad)" stroke="#0f172a" strokeWidth="0.5" textAnchor="middle" dominantBaseline="middle" fontFamily='"Microsoft YaHei", "SimHei", sans-serif' filter="drop-shadow(1px 2px 2px rgba(0,0,0,0.8))">
            六
          </text>
        </svg>
